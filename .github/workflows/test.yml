name: Run tests

on: [push]

# Only the latest push per ref is interesting.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Nix
        uses: nixbuild/nix-quick-install-action@9f63be77f412a248c9d9a65a4c82cf066cdf8f0c # v35
        with:
          # Keep dev shell inputs alive in the store so they end up in the cache.
          nix_conf: |
            keep-env-derivations = true
            keep-outputs = true

      - name: Restore and save Nix store
        uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('flake.lock', 'flake.nix', 'nix/**.nix') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
          # Keep the cache small enough to stay fast to up- and download.
          gc-max-store-size-linux: 1G
          purge: true
          purge-prefixes: nix-${{ runner.os }}-
          purge-created: 0
          purge-primary-key: never

      - name: Build dev shell
        run: nix develop --command true

      - name: Restore npm cache and playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.npm
            ~/.cache/ms-playwright
          key: deps-${{ runner.os }}-${{ hashFiles('server/package-lock.json') }}
          restore-keys: deps-${{ runner.os }}-

      - name: Check formatting
        run: nix develop --command treefmt --ci

      - name: Install dependencies
        run: nix develop --command bash -c 'cd server && npm ci --prefer-offline --no-audit --no-fund'

      - name: Install chromium
        run: nix develop --command bash -c 'cd server && npx playwright install chromium-headless-shell'

      - name: Run Tests
        run: nix develop --command bash -c 'cd server && npm test'
